# Places the pipeline builds as tiled metros (PLAN.md §2 F). The owner edits this list;
# build_places.py builds every entry not yet in Server/manifest.json (or --only <id>).
#
#   id        directory under Server/ and the manifest id (stable; never reuse)
#   name      what the app shows
#   extract   Geofabrik path, without "-latest.osm.pbf" (download.geofabrik.de/<extract>-latest.osm.pbf)
#   places    Nominatim names whose union is the metro boundary (build_metro.py --place)
#   survey    optional city sidewalk survey (survey.py SURVEYS: nyc, seattle)
#   demo      LAT,LON the app shows when the user is elsewhere
#   min_component  optional; keep disconnected pieces at least this big (default 2000)
#
# USA only for now (PLAN.md standing decisions).

metros:
  # --- built before this list existed (kept so rebuilds use the same arguments) ---
  - id: seattle
    name: Seattle
    extract: north-america/us/washington
    places: ["Seattle, Washington, USA"]
    survey: seattle
    demo: 47.6097,-122.3422
  - id: nyc
    name: New York
    extract: north-america/us/new-york
    places: ["New York City, New York, USA"]
    survey: nyc
    demo: 40.7536,-73.9832
  - id: la
    name: Los Angeles
    extract: north-america/us/california/socal
    places: ["Los Angeles, California, USA", "Beverly Hills, California, USA",
             "West Hollywood, California, USA", "Santa Monica, California, USA",
             "Culver City, California, USA"]
    demo: 34.0505,-118.2551

  # --- first new place: the end-to-end check of this pipeline ---
  - id: portland
    name: Portland
    extract: north-america/us/oregon
    places: ["Portland, Oregon, USA"]
    demo: 45.5231,-122.6765

